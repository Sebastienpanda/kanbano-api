  /workspaces:
    get:
      description: 'List the current user''s workspaces. The response shape depends
        on which query params are set (checked in this order): 1) q set -> returns
        []models.WorkspaceSearchResult (search results); 2) view=names -> returns
        []models.WorkspaceName (id+name only); 3) view=recent -> returns []models.Workspace
        (most recently accessed, unpaginated); 4) none of the above -> returns []models.Workspace,
        paginated via limit/offset. Only one variant applies per request; q takes
        priority over view.'
      parameters:
      - description: Search query. When set, returns []models.WorkspaceSearchResult
          regardless of other params.
        in: query
        name: q
        type: string
      - description: '''names'' returns []models.WorkspaceName, ''recent'' returns
          []models.Workspace unpaginated. Ignored if q is set.'
        enum:
        - names
        - recent
        in: query
        name: view
        type: string
      - description: Page size (default 50, max 200). Only applies to the default
          paginated view.
        in: query
        name: limit
        type: integer
      - description: Page offset (default 0). Only applies to the default paginated
          view.
        in: query
        name: offset
        type: integer
