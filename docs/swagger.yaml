  /workspaces/{id}/members/{memberID}/role:
    put:
      consumes:
      - application/json
      description: Sets whether this workspace is visible to the member ('private',
        the default, or 'public') and/or their role on it ('view', the default, or
        'edit'). Both fields are optional and independent; omitting one leaves it
        unchanged (or at its default if this is the member's first override on this
        workspace). Allowed for the organisation owner, or an admin the workspace
        is shared with; an admin only manages members, never another admin or the
        owner, and nobody changes their own access. The member must belong to the
        organisation. Same effect as PATCH /workspaces/{id} with a single entry in
        members.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Member ID (user ID)
        in: path
        name: memberID
        required: true
        type: string
      - description: New visibility and/or role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.setWorkspaceRoleBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.UpdateResponse'
        "400":
          description: 'invalid id | invalid memberID | could not read body | could
            not decode body | errors: {field: message} (validation)'
          schema:
            $ref: '#/definitions/BadRequestResponse'
        "401":
          description: Missing or invalid token (text/plain)
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "403":
          description: organisation owner or admin required | cannot change your own
            access | cannot manage this member's access
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: workspace not found | member not found in this organisation
          schema:
            $ref: '#/definitions/ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/UnsupportedMediaTypeResponse'
        "429":
          description: Rate limit exceeded (text/plain)
          schema:
            $ref: '#/definitions/TooManyRequestsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: Override a member's visibility and/or role on a workspace
      tags:
      - role
  /workspaces/{id}/tasks/roles:
    get:
      description: 'Lists the tasks the caller sees, with their role on each: every
        task with the same role for a member (''edit'' if they may modify tasks),
        only the tasks shared with them for a guest, with their guest role (''edit''
        then only allows changing the description).'
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
