          schema:
            $ref: '#/definitions/TooManyRequestsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: List the caller's resolved role for every task in a workspace
      tags:
      - task
  /ws:
    get:
      description: Upgrades to a WebSocket connection. The JWT is passed via the Sec-WebSocket-Protocol
        header as "bearer, <token>" (not a normal Authorization header, so no BearerAuth
        security scheme applies here).
      responses:
        "101":
          description: Switching Protocols
        "401":
          description: Missing or invalid token (text/plain)
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "429":
          description: Rate limit exceeded (text/plain)
          schema:
            $ref: '#/definitions/TooManyRequestsResponse'
      summary: WebSocket connection for real-time updates
      tags:
      - ws
securityDefinitions:
  BearerAuth:
