  /roles:
    get:
      description: 'Returns the caller''s effective role at a given point in time.
        With organisation_id set, returns their role in that organisation (''owner'',
        ''admin'' or ''member''; 404 if they do not belong to it). With workspace_id
        set, returns their workspace role: ''edit'' if they may modify columns and
        tasks, ''view'' otherwise (always ''view'' for a guest). With task_id as well,
        returns their role on that task: the workspace role for a member, the invitation
