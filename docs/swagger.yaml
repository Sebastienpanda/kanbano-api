  /guest-invitations/{id}:
    patch:
      consumes:
      - application/json
      description: Once accepted, the guest sees the task and appears among its assignees.
        An expired invitation can no longer be accepted (410); its author may resend
        it. Only pending invitations can be answered (404 otherwise). 409 if the caller
        is already a guest of the task, or has joined the task's organisation since
        the invitation was sent.
      parameters:
      - description: Invitation ID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateTaskGuestInvitationBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.UpdateResponse'
        "400":
          description: 'invalid id | could not read body | could not decode body |
            errors: {field: message} (validation)'
          schema:
            $ref: '#/definitions/BadRequestResponse'
        "401":
          description: Missing or invalid token (text/plain)
          schema:
            $ref: '#/definitions/UnauthorizedResponse'
        "404":
          description: user not found | invitation not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: you already have access to this task
          schema:
            $ref: '#/definitions/ErrorResponse'
        "410":
          description: invitation expired
          schema:
            $ref: '#/definitions/ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/UnsupportedMediaTypeResponse'
        "429":
          description: Rate limit exceeded (text/plain)
          schema:
            $ref: '#/definitions/TooManyRequestsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: Accept or decline a task guest invitation
      tags:
      - task
  /guest-invitations/{id}/resend:
    post:
      description: Sends the invitation email again and gives the invitation 7 more
        days from now, expired or not. Allowed for the author of the invitation only,
        as long as they may still invite guests on the workspace.
      parameters:
      - description: Invitation ID
