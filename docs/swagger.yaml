      - BearerAuth: []
      summary: Get a workspace
      tags:
      - workspace
    patch:
      consumes:
      - application/json
      description: 'Updates name/description and, in the same transaction, the access
        of each listed member on this workspace: visibility (''private'' removes the
        member''s access, ''public'' grants it) and/or role (''view'' or ''edit'').
        For each member, an omitted field keeps its current value, or its default
        (''private'' / ''view'') if the member had no access yet: to add a member,
        send visibility ''public''. Allowed for the organisation owner, or an admin
        the workspace is shared with (403 for other users who see the workspace, 404
        "workspace not found" for the others). An admin only manages members, never
        another admin or the owner; nobody changes their own access (403). Every listed
        member must belong to the organisation (404 otherwise). Nothing is changed
        when a check fails.'
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
